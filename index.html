<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artmug Custom Menu</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="artmug-menu" aria-label="아트머그 커스텀 메뉴">
    <button type="button" class="menu-link" data-section="top" aria-label="위로가기">
      <img
        src="https://lh3.googleusercontent.com/d/1K2I-zPRGkf23VoICx24byC2j21oKiEfu"
        alt="위로가기"
      >
    </button>

    <button type="button" class="menu-link" data-section="method" aria-label="신청 방법">
      <img
        src="https://lh3.googleusercontent.com/d/1bGVMtV8nbY6OVYIHmE4UDxT2knWcAo4B"
        alt="신청 방법"
      >
    </button>

    <button type="button" class="menu-link" data-section="mode" aria-label="신청서 양식">
      <img
        src="https://lh3.googleusercontent.com/d/1d8n9SfkKnLRfhaEF5onnsVNPd7juRYpk"
        alt="신청서 양식"
      >
    </button>

    <button type="button" class="menu-link" data-section="type" aria-label="타입 안내">
      <img
        src="https://lh3.googleusercontent.com/d/1E1SA_4dAOHdmniQWoLGL8WbQPVS4XaB2"
        alt="타입 안내"
      >
    </button>

    <button type="button" class="menu-link" data-section="caution" aria-label="주의사항">
      <img
        src="https://lh3.googleusercontent.com/d/1j-zujcUaE7HLeHO8DbAFpUlJSc4my6ae"
        alt="주의사항"
      >
    </button>

    <button type="button" class="qna-button" data-action="qna" aria-label="문의하기">
      <span aria-hidden="true"></span>
    </button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
