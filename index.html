<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artmug Quick Menu</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="artmug-menu" aria-label="아트머그 커스텀 메뉴">
      <div class="menu-inner">
        <!-- 상단 헤더 -->
        <header class="menu-header">
          <p class="menu-eyebrow">ARTMUG</p>
          <h1>Quick menu</h1>
        </header>

        <!-- 메뉴 -->
        <nav class="menu-list" aria-label="Quick menu">
          <!-- 위로 가기 -->
          <button type="button" class="menu-button top" data-section="top" aria-label="위로 가기">
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">위로 가기</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 진행 과정 -->
          <button
            type="button"
            class="menu-button process"
            data-section="process"
            aria-label="진행 과정"
          >
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">진행 과정</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 타입 안내 -->
          <button type="button" class="menu-button type" data-section="type" aria-label="타입 안내">
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">타입 안내</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 주의사항 -->
          <button
            type="button"
            class="menu-button caution"
            data-section="caution"
            aria-label="주의사항"
          >
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">주의사항</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 협업 작가 -->
          <button type="button" class="menu-button collab" data-section="collab" aria-label="협업 작가">
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">협업 작가</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 일러스트 샘플 -->
          <button type="button" class="menu-button sample" data-section="sample" aria-label="일러스트 샘플">
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">일러스트 샘플</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>

          <!-- 작업 신청서 -->
          <button type="button" class="menu-button apply" data-section="apply" aria-label="작업 신청서">
            <span class="menu-dot" aria-hidden="true"></span>
            <span class="menu-title">작업 신청서</span>
            <span class="menu-arrow" aria-hidden="true">›</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
